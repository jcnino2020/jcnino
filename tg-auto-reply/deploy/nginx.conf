# Alternative Nginx reverse proxy configuration for Oracle Cloud Ubuntu VM
server {
    listen 80;
    server_name tg.jcnino.dev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name tg.jcnino.dev;

    # Certbot / Let's Encrypt paths
    ssl_certificate /etc/letsencrypt/live/tg.jcnino.dev/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/tg.jcnino.dev/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location /tg {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Required for Server-Sent Events (SSE)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
    }
}
