const money=n=>'₱'+Number(n).toLocaleString('en-PH',{maximumFractionDigits:2}), minutes=s=>{let [h,m]=s.split(':').map(Number);return h*60+m}, stamp=n=>`${String(Math.floor((n+1440)/60)%24).padStart(2,'0')}:${String((n+1440)%60).padStart(2,'0')}`, display=s=>{let [h,m]=s.split(':').map(Number);return `${h%12||12}:${String(m).padStart(2,'0')} ${h>=12?'PM':'AM'}`};
function save(){try{localStorage.setItem('manila-jc-v1',JSON.stringify(data));$('#savestatus').textContent='Saved on this browser'}catch{$('#savestatus').textContent='Storage unavailable · export a backup'}}
function notify(s){$('#toast').innerHTML=icon('check')+esc(s);$('#toast').classList.remove('hidden');setTimeout(()=>$('#toast').classList.add('hidden'),3000)}
function statusOptions(current){return statuses.map(s=>`<option ${s===current?'selected':''}>${s}</option>`).join('')}
function itineraryText(){return data.items.map((list,d)=>`${weekdays[d]}, November ${dates[d]}, 2026 (PHT)\n`+list.map(i=>`${display(i.time)} · ${i.title} [${i.status}]\n${i.note}`).join('\n')).join('\n\n')}
function download(name,content,type){let u=URL.createObjectURL(new Blob([content],{type}));let a=document.createElement('a');a.href=u;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}
function shell(){document.body.innerHTML=`<div id="app" class="app"><aside><a href="#" class="brand" data-tab="Itinerary"><span class="brandmark">${icon('plane')}</span>wayfarer<span class="branddot">.</span></a><div class="workspace">JC’S TRAVEL SPACE</div><nav>${[['Itinerary','calendar'],['Flights & stays','plane'],['Transport planner','sliders'],['Budget & expenses','wallet'],['Photography','camera'],['Checklist','check']].map(([t,i])=>`<button data-tab="${t}">${icon(i)}${t}${t==='Checklist'?'<small id="checkcount"></small>':''}</button>`).join('')}</nav><div class="asidebottom"><div class="tripmini"><span class="miniavatar">JC</span><div>Manila, Philippines<small>27–30 November 2026</small></div></div><button class="plain" id="theme">${icon('sun')} Change appearance</button><p>Saved on this browser.<br/>Export a backup to keep a copy.</p><button class="plain" id="export">${icon('download')} Export data</button><label class="plain" style="cursor:pointer"><input type="file" id="import" accept="application/json" hidden>Restore backup</label></div></aside><main><header><span>My trips <span class="crumb">/</span><b>Manila 2026</b></span><span class="headerend"><span class="savedot"></span><span id="savestatus">Saved on this browser</span><span class="avatar">JC</span></span></header><div class="body"><section class="hero"><div class="heroart"></div><div class="eyebrow">A LONG WEEKEND, WELL SPENT</div><h1>Manila, at your pace<span>.</span></h1><p>A little exploring. Good food. Plenty of breathing room.</p><div class="herometa"><span>${icon('calendar')} Nov 27–30, 2026</span><span>${icon('pin')} Manila & BGC</span><span>${icon('bag')} 4 travelers · 2 suitcases</span></div></section><section class="stats"><div><span>TRIP LENGTH</span><strong>4 days <small>/ 3 nights</small></strong></div><div><span>FLIGHTS IN YOUR PLAN</span><strong>2 flights <small>Cebu Pacific</small></strong></div><div><span>PLANNING ALLOWANCE</span><strong id="planned"></strong></div><div><span>YOUR TRAVEL STYLE</span><strong class="green">Comfortable <small>Room to adjust</small></strong></div></section><div class="sectiontop"><div><div class="eyebrow">YOUR TRIP, YOUR WAY</div><h2 id="title"></h2></div><button class="button" id="copy">${icon('copy')} Copy itinerary</button></div><div id="content"></div><footer><p><b>Planning notes</b> · All times Asia/Manila. Costs and travel times are editable estimates, not live quotes. Flight details and hotels come from your earlier plan. Supplier details need reconfirmation.</p><details><summary>References & verification notes · November 8, 2026</summary><p><a target="_blank" rel="noreferrer" href="https://help.cebupacificair.com/article/check-in-and-boarding-122499">Cebu Pacific check-in and boarding</a> · Recommends airport arrival 3 hours before domestic flights; this planner uses that conservative target.</p><p><a target="_blank" rel="noreferrer" href="https://www.ikea.com/ph/en/stores/pasay-city/">IKEA Pasay official store page</a> · Location and general hours. Nov 27 buffet and ticket terms not verified.</p><p><a target="_blank" rel="noreferrer" href="https://www.ikea.com/ph/en/customer-service/contact-us/">IKEA contact information</a> · Check seating, prices and membership eligibility directly.</p><p>MOA Travelers Lounge fees, hours, suitcase acceptance and collection cutoff remain unverified. Transport allowances are assumptions, not sourced tariffs. Photography settings are starting points for experimentation.</p></details></footer></div></main><div id="toast" class="toast hidden" role="status"></div><div id="modal" class="modalback hidden"></div></div>`;render()}
function render(){ $('#app').classList.toggle('dark',data.dark);$$('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));$('#checkcount').textContent=data.checks.length+'/8';$('#planned').innerHTML=money(data.items.flat().reduce((a,i)=>a+i.cost,0))+' <small>+ unknowns</small>';$('#title').textContent=tab==='Itinerary'?'The daily plan':tab;
if(tab==='Itinerary') renderItinerary();if(tab==='Flights & stays')renderFlights();if(tab==='Transport planner')renderTransport();if(tab==='Budget & expenses')renderBudget();if(tab==='Photography')renderPhotography();if(tab==='Checklist')$('#content').innerHTML=`<section class="panel formpanel"><h3>A few checks for a smoother trip</h3><p>${data.checks.length} of 8 checked by you. No deadlines or completed arrangements inferred.</p>${checklist.map((t,i)=>`<label class="checkrow"><input type="checkbox" data-check="${i}" ${data.checks.includes(i)?'checked':''}><span>${esc(t)}</span></label>`).join('')}</section>`;}
function renderItinerary(){ $('#content').innerHTML=`<div class="daytabs">${dates.map((d,i)=>`<button data-day="${i}" class="${day===i?'selected':''}"><span>${weekdays[i].slice(0,3)}</span><strong>${d}</strong><small>${['Arrival & MOA','Hotel change','Explore BGC','Homeward'][i]}</small></button>`).join('')}</div><div class="contentgrid"><section class="panel itinerary"><div class="panelhead"><div><h3>${['Hello, Manila.','A change of scenery.','A day in the neighborhood.','Take it home, easy.'][day]}</h3><p>${weekdays[day]}, November ${dates[day]} · All times PHT</p></div><select id="filter" aria-label="Filter status">${['All statuses',...statuses].map(s=>`<option ${s===filter?'selected':''}>${s}</option>`).join('')}</select></div><div class="timeline">${data.items[day].filter(i=>filter==='All statuses'||i.status===filter).map(i=>{let prev=data.items[day][data.items[day].indexOf(i)-1];return `<article class="event"><div class="eventtime">${display(i.time)}<small>${i.duration} min</small></div><div class="eventdot ${i.status==='Confirmed'?'solid':''}"></div><button class="eventbody" data-edit="${i.id}"><div class="eventtitle"><h4>${esc(i.title)}</h4><span class="status ${i.status.toLowerCase().replace(' ','-')}">${esc(i.status)}</span></div><p>${esc(i.note)}</p>${i.cost?`<span class="cost">${money(i.cost)} group estimate</span>`:''}${prev&&minutes(prev.time)+prev.duration>minutes(i.time)?'<span class="overlap">Time overlaps the previous block. Adjust before confirming.</span>':''}</button></article>`}).join('')||'<p style="padding:25px">No stops match this status.</p>'}</div><button class="addrow" id="add">${icon('plus')} Add a stop or a little breathing room</button></section><div class="rightcol"><section class="feature"><span class="eyebrow">${icon('sun')} THE FRIDAY ANCHOR</span><h3>Save the evening<br>for MOA.</h3><div class="bigtime">5:00 <span>–</span> 7:00 <small>PM</small></div><p>Your preferred MOA / IKEA window. Buffet seating and tickets still need verification.</p><div class="route"><span>NAIA</span>${icon('arrow')}<span>MOA + bags</span>${icon('arrow')}<span>Hotel</span></div><button data-tab="Transport planner">Compare the arrival options ${icon('arrow')}</button></section><section class="panel notecard"><div class="eyebrow">KEEP IT COMFORTABLE</div><h3>One area at a time.</h3><p>Friday stays around MOA. Sunday stays in BGC. Optional stops can disappear without making the day feel unfinished.</p><div class="notefooter">${icon('clock')} Leave space for traffic & rest</div></section><section class="panel notecard"><h3>Still to check <span class="count">3</span></h3><p>MOA luggage storage<br>IKEA buffet & membership terms<br>Hotel and terminal details</p><button class="textbutton" data-tab="Checklist">Open trip checklist ${icon('arrow')}</button></section></div></div><details class="panel copybox"><summary>Copy-ready itinerary</summary><pre>${esc(itineraryText())}</pre><button class="button" id="downloadtext">${icon('download')} Download text</button></details>`;}
function renderFlights(){ $('#content').innerHTML=`<div class="twocol">${[0,1].map(x=>`<section class="panel formpanel"><div class="eyebrow">${x?'NOV 30 · RETURN':'NOV 27 · OUTBOUND'}</div><h3>${x?'Manila → Bacolod':'Bacolod → Manila'}</h3><p>Confirmed in your earlier plan. Not synced with the airline. Verify the latest e-ticket.</p>${['Flight number','Departure (PHT)','Arrival (PHT)'].map((t,j)=>`<label>${t}<input data-flight="${x*3+j}" type="${j?'time':'text'}" value="${esc(data.flight[x*3+j])}" required></label>`).join('')}<p>Terminal · Unknown<br>Baggage allowance · Unknown<br>Fare paid · Unknown</p><a target="_blank" rel="noreferrer" href="https://www.cebupacificair.com/en-PH/manage">Check with Cebu Pacific ↗</a></section>`).join('')}${data.hotel.map((h,i)=>`<section class="panel formpanel"><div class="eyebrow">${i?'NOV 28–30 · 2 NIGHTS':'NOV 27–28 · 1 NIGHT'}</div><label>Hotel<input data-hotel="${i}" value="${esc(h)}"></label><label>Reservation status<select data-booking="${i}">${statusOptions(data.bookingStatus[i])}</select></label><p>Carried over from your hotel plan. Booking evidence, rates, check-in/out and luggage holding are not verified.</p></section>`).join('')}<section class="panel formpanel"><h3>IKEA · Nov 27, 5–7 PM</h3><p>Preferred window only. No reservation evidence supplied. Price and buffet schedule unknown.</p><label>Reservation status<select data-booking="2">${statusOptions(data.bookingStatus[2])}</select></label></section></div>`;}
function renderTransport(){let a=settings;$('#content').innerHTML=`<div class="twocol"><section class="panel formpanel"><h3>Arrival route comparison</h3><p>Choose a strategy. These are editable planning assumptions, not live traffic or fare quotes.</p>${[['direct','Direct to MOA','Fewer cross-city transfers. Depends on luggage acceptance.'],['hotel','Hotel first','Bag drop depends on hotel confirmation. Adds a city detour.']].map(([v,t,n])=>`<button data-option="${v}" class="option ${option===v?'chosen':''}"><strong>${t}</strong><p>${n}</p></button>`).join('')}<table><thead><tr><th>Route</th><th>Drive allowance</th><th>Group cost</th></tr></thead><tbody><tr><td>NAIA → MOA</td><td>30–60 min</td><td>₱350–700</td></tr><tr><td>Via hotel → MOA</td><td>90–150 min</td><td>₱800–1,500</td></tr><tr><td>MOA → hotel</td><td>45–90 min</td><td>₱350–700</td></tr><tr><td>BGC → NAIA</td><td>60–120 min</td><td>₱500–1,000</td></tr></tbody></table><p>Illustrative allowances per vehicle. Tolls, terminal, rain and surge may change these. Check vehicle capacity for four people + two suitcases.</p><p><b>Grab:</b> get the current app quote and pickup bay.<br><b>Taxi:</b> official queue, ask for meter.<br><b>Hotel transfer:</b> request a quote and luggage capacity.<br><b>Public transit:</b> verify route, changes and suitcase practicality.<br><b>Walk:</b> nearby BGC stops only; allow crossings, heat and rain.</p></section><section class="panel formpanel"><h3>Build a realistic transfer</h3><label>Transport<select data-setting="transport">${['Grab','Metered taxi','Hotel transfer','Public transit','Walk'].map(s=>`<option ${s===a.transport?'selected':''}>${s}</option>`).join('')}</select></label><label>Ready to depart<input data-setting="depart" type="time" value="${a.depart}"></label>${[['Base travel time (min)','base'],['Traffic buffer (min)','buffer'],['Pickup / walking allowance (min)','pickup'],['Arrival delay (min)','delay'],['Group fare estimate (₱)','fare'],['Travelers splitting cost','people']].map(([t,k])=>`<label>${t}<input data-setting="${k}" type="number" min="${k==='people'?1:0}" value="${a[k]}"></label>`).join('')}<div id="transferresult"></div><button id="applytransfer" class="button primary">Apply transfer to Friday</button><p>Updates Friday’s airport → MOA transfer and marks it tentative. Other stops remain editable.</p></section></div><section class="panel formpanel"><h3>When the plan changes</h3><div class="threecol"><div><h4>Flight delay</h4><p>Drop optional browsing first. Keep food and rest. If 5 PM is unrealistic, check IKEA ticket-change terms before altering tickets.</p></div><div><h4>Storage unavailable</h4><p>Use hotel luggage holding if confirmed. Recalculate travel before committing to MOA. Do not assume package counters accept suitcases.</p></div><div><h4>Rain or gridlock</h4><p>Stay indoors in the current area. Skip bay walks. Treat Uptown or Mitsukoshi as alternatives rather than extra stops.</p></div></div><div id="airportresult"></div></section>`;renderResult()}
function renderResult(){let a=settings,total=a.base+a.buffer+a.pickup+a.delay,arrival=minutes(a.depart)+total;$('#transferresult').innerHTML=`<div class="result"><small>ESTIMATED ARRIVAL · ${esc(a.transport)}</small><h3>${display(stamp(arrival))}</h3><p>${total} min total · ${money(a.fare/Math.max(1,a.people))} per person</p></div>${arrival>1020?'<p class="warning">This misses the 5 PM start. Drop optional stops or revise the evening.</p>':''}`;$('#airportresult').innerHTML=`<p>Return flight ${display(data.flight[4])}: aim at airport by <b>${display(stamp(minutes(data.flight[4])-180))}</b>. With the current ${total}-minute transfer allowance, leave by <b>${display(stamp(minutes(data.flight[4])-180-total))}</b>. Use the BGC → NAIA travel allowance, not an arrival-route assumption, before relying on this calculation.</p>`}
function renderBudget(){let total=data.expenses.reduce((a,e)=>a+e.amount,0);$('#content').innerHTML=`<div class="twocol"><section class="panel formpanel"><h3>Room in the budget</h3><div class="budgetnumber">${money(total)}</div><p>Recorded actual expenses · ${money(total/4)} per traveler if split equally.</p><div class="budgetline"><span>Editable itinerary allowances</span><b>${money(data.items.flat().reduce((a,i)=>a+i.cost,0))}</b></div><div class="budgetline"><span>Flights, hotels, buffet, storage</span><b>Unknown</b></div><p>This is not a complete budget. No actual spending is inferred. Click a daily stop to edit its group estimate. A zero estimate means no amount supplied, not a free service.</p></section><section class="panel formpanel"><h3>Record an expense</h3><form id="expenseform"><label>Description<input name="name" required placeholder="e.g. Airport transfer" maxlength="150"></label><label>Actual amount (₱, group)<input name="amount" type="number" min="0" step="0.01" required></label><button class="button primary">${icon('plus')} Add expense</button></form>${data.expenses.map((e,i)=>`<div class="budgetline"><span>${esc(e.name)}</span><b>${money(e.amount)}</b><button class="plain" data-deleteexpense="${i}" aria-label="Delete ${esc(e.name)}">${icon('trash')}</button></div>`).join('')}</section></div>`}
function renderPhotography(){$('#content').innerHTML=`<section class="panel formpanel"><div class="eyebrow">NIKON Z50 · TRAVEL LIGHT</div><h3>Three lenses. Choose for the day.</h3><div class="threecol">${[['Viltrox 25mm f/1.7 Air','Your everyday walkaround','Food, evening streets and environmental portraits. Start at 1/125–1/250 for people, f/1.7–2.8, Auto ISO. Check focus carefully up close.'],['Nikon Z DX 16–50mm','The flexible daytime option','Use 16mm for buildings and groups, zoom for details. VR helps static scenes; moving people still need a faster shutter.'],['Nikon Z DX 50–250mm','Bring with a purpose','Distant details and compressed city views. Start around 1/500 for moving subjects. Consider leaving it at the hotel on a mall day.']].map(([t,s,n])=>`<div>${icon('camera')}<h4>${t}</h4><b>${s}</b><p>${n}</p></div>`).join('')}</div></section><section class="panel formpanel"><h3>Comfort first, photos second</h3><p>Friday: start with the 25mm and 16–50mm. Keep the 50–250mm optional. Try 1/60–1/125 for steady, static subjects only, then inspect sharpness. Raise shutter speed for moving people.</p><p>Light changes quickly during 5–7 PM. Do not build the schedule around an exact sunset promise. Check mall security and photography rules on site; ask before photographing people closely.</p><p>Keep batteries, memory cards, camera and valuables with you, not in stored luggage. Carry a dry cloth and rain cover. Choose a sheltered place for lens changes.</p></section>`}
let editing=null,previousFocus=null;
function openEdit(id){previousFocus=document.activeElement;editing=structuredClone(data.items[day].find(i=>i.id===id)||{id:Date.now(),time:'14:00',title:'',note:'',duration:60,status:'Tentative',cost:0});let i=editing;$('#modal').classList.remove('hidden');$('#modal').innerHTML=`<section class="modal panel formpanel" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><h3 id="modaltitle">Edit your day</h3><form id="editform"><label>Stop name<input name="title" value="${esc(i.title)}" required maxlength="200"></label><div class="twocol"><label>Start time<input name="time" type="time" value="${i.time}" required></label><label>Duration (minutes)<input name="duration" type="number" min="5" max="1440" value="${i.duration}" required></label></div><label>Notes<textarea name="note">${esc(i.note)}</textarea></label><label>Status<select name="status">${statusOptions(i.status)}</select></label><label>Group estimate (₱) · 0 if unknown<input name="cost" type="number" min="0" step="0.01" value="${i.cost}" required></label><div class="modalactions"><button type="button" class="button" id="cancel">Cancel</button><button class="button primary">Save stop</button><button type="button" class="plain" id="deletestop">${icon('trash')} Delete</button></div></form></section>`;$('#modal input').focus()}
function closeEdit(){$('#modal').classList.add('hidden');previousFocus?.focus()}
document.addEventListener('click',async e=>{let b=e.target.closest('button,a');if(!b)return;
if(b.dataset.tab){e.preventDefault();tab=b.dataset.tab;render()}
if(b.dataset.day!==undefined){day=Number(b.dataset.day);render()}
if(b.dataset.edit)openEdit(Number(b.dataset.edit));if(b.id==='add')openEdit(0);
if(b.id==='cancel')closeEdit();if(b.id==='deletestop'){data.items[day]=data.items[day].filter(i=>i.id!==editing.id);save();closeEdit();render()}
if(b.id==='theme'){data.dark=!data.dark;save();render()}
if(b.id==='export')download('manila-trip-backup.json',JSON.stringify(data,null,2),'application/json');
if(b.id==='downloadtext')download('manila-itinerary.txt',itineraryText(),'text/plain');
if(b.id==='copy'){try{await navigator.clipboard.writeText(itineraryText());notify('Itinerary copied')}catch{tab='Itinerary';render();$('.copybox').open=true;let range=document.createRange();range.selectNodeContents($('.copybox pre'));let s=window.getSelection();s.removeAllRanges();s.addRange(range);notify('Text selected. Use Copy from your browser.')}}
if(b.dataset.option){option=b.dataset.option;settings.base=option==='direct'?45:120;settings.fare=option==='direct'?500:1100;renderTransport()}
if(b.id==='applytransfer'){let a=settings;data.items[0]=data.items[0].map(i=>i.id===3?{...i,time:stamp(minutes(a.depart)+a.delay),duration:a.base+a.buffer+a.pickup,cost:a.fare,title:option==='direct'?'Head straight to Mall of Asia':'Hotel luggage drop → Mall of Asia',status:'Tentative',note:`${a.transport}; ${a.base} min travel + ${a.buffer} min traffic buffer + ${a.pickup} min pickup. ${option==='direct'?'Luggage storage at MOA needs verification.':'Verify hotel luggage holding first.'} Planning estimate, not a live quote.`}:i);save();notify('Friday transfer updated. Review later stop times.');render()}
if(b.dataset.deleteexpense!==undefined){data.expenses.splice(Number(b.dataset.deleteexpense),1);save();renderBudget()}});
document.addEventListener('change',e=>{let el=e.target;
if(el.id==='filter'){filter=el.value;renderItinerary()}
if(el.dataset.check!==undefined){let i=Number(el.dataset.check);data.checks=el.checked?[...data.checks,i]:data.checks.filter(x=>x!==i);save();render()}
if(el.dataset.flight!==undefined){let i=Number(el.dataset.flight);if(!el.value){renderFlights();return}data.flight[i]=el.value;let d=i<3?0:3,id=i<3?1:16;data.items[d]=data.items[d].map(item=>item.id===id?{...item,time:data.flight[d===0?1:4],note:`Cebu Pacific ${data.flight[d===0?0:3]} · arrival ${display(data.flight[d===0?2:5])}. User-edited details; verify the latest e-ticket.`}:item);save();render()}
if(el.dataset.hotel!==undefined){data.hotel[Number(el.dataset.hotel)]=el.value;save()}
if(el.dataset.booking!==undefined){data.bookingStatus[Number(el.dataset.booking)]=el.value;save()}
if(el.id==='import'){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let v=JSON.parse(t);if(!Array.isArray(v.items)||v.items.length!==4||!v.items.every(l=>Array.isArray(l)&&l.every(i=>typeof i.id==='number'&&typeof i.title==='string'&&/^\d{2}:\d{2}$/.test(i.time)&&Number.isFinite(i.duration)&&Number.isFinite(i.cost)&&statuses.includes(i.status)&&typeof i.note==='string'))||!Array.isArray(v.expenses)||!v.expenses.every(e=>typeof e.name==='string'&&Number.isFinite(e.amount))||!Array.isArray(v.checks)||!Array.isArray(v.flight)||v.flight.length!==6||!Array.isArray(v.hotel)||v.hotel.length!==2||!Array.isArray(v.bookingStatus)||v.bookingStatus.length!==3)throw Error();data={...data,...v};save();render();notify('Backup restored')}catch{notify('Invalid backup. Your current plan is unchanged.')}})}
});
document.addEventListener('input',e=>{let el=e.target,k=el.dataset.setting;if(!k)return;settings[k]=['transport','depart'].includes(k)?el.value:Math.max(k==='people'?1:0,Number(el.value));if(settings.depart)renderResult()});
document.addEventListener('submit',e=>{if(e.target.id==='editform'){e.preventDefault();let f=new FormData(e.target),i={id:editing.id,time:f.get('time'),title:f.get('title'),note:f.get('note'),status:f.get('status'),duration:Number(f.get('duration')),cost:Number(f.get('cost'))};let list=data.items[day];data.items[day]=(list.some(x=>x.id===i.id)?list.map(x=>x.id===i.id?i:x):[...list,i]).sort((a,b)=>a.time.localeCompare(b.time));save();closeEdit();render();notify('Itinerary updated')}
if(e.target.id==='expenseform'){e.preventDefault();let f=new FormData(e.target);data.expenses.push({name:f.get('name'),amount:Number(f.get('amount'))});save();renderBudget();notify('Expense recorded')}});
document.addEventListener('keydown',e=>{if($('#modal').classList.contains('hidden'))return;if(e.key==='Escape')closeEdit();if(e.key==='Tab'){let focusable=[...$('#modal').querySelectorAll('button,input,select,textarea')],first=focusable[0],last=focusable.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
document.addEventListener('click',e=>{if(e.target.id==='modal')closeEdit()});
shell();
</script></body></html>
