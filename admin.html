<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Redirecting to CMS Admin Hub...</title>
  <meta http-equiv="refresh" content="0;url=admin/index.html"/>
  <script>
    // Seamless instant redirect preserving query parameters
    const search = window.location.search || '';
    const hash = window.location.hash || '';
    window.location.replace('admin/index.html' + search + hash);
  </script>
  <style>
    body {
      background-color: #060608;
      color: #ffffff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
    }
    .card {
      background: rgba(18, 18, 20, 0.92);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      padding: 32px;
      max-width: 380px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
    }
    a {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 6px;
      padding: 8px 16px;
      display: inline-block;
      text-decoration: none;
      font-weight: 600;
      font-size: 13px;
      transition: background 0.15s ease;
    }
    a:hover {
      background: rgba(255, 255, 255, 0.15);
    }
  </style>
</head>
<body>
  <div class="card">
    <h2 style="font-size: 16px; font-weight: 700; margin: 0 0 8px 0;">Opening CMS Portal...</h2>
    <p style="font-size: 13px; color: #888; margin: 0 0 20px 0;">If you are not redirected automatically, please click below:</p>
    <p style="margin: 0;"><a href="admin/index.html">Open Admin Dashboard &rarr;</a></p>
  </div>
</body>
</html>
