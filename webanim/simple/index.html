<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Simple Web Animation — Flying Character</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Fullscreen Animation Stage -->
  <main id="stage" class="stage">
    <!-- Sky Background Elements -->
    <div class="sky-backdrop">
      <div class="moon"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>

    <!-- Container for Dropped Packages & Effects -->
    <div id="packageContainer"></div>

    <!-- On-screen hint overlay (auto hides after 5s) -->
    <div id="controlsHint" class="controls-hint">
      <span>Use <code>W A S D</code> or <code>Arrow Keys</code> to Move &bull; Press <code>Space</code> to Drop Package 📦</span>
    </div>

    <!-- Lower-Left Info Button -->
    <button id="infoBtn" class="info-btn" title="Toggle Controls Info" aria-label="Controls Info">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="info-svg">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </button>

    <!-- Character Element -->
    <div id="character" class="character hover-idle">
      <div class="character-rig">
        <!-- Spinning Rotors -->
        <div class="rotor rotor-left"><div class="blade"></div></div>
        <div class="rotor rotor-right"><div class="blade"></div></div>
        
        <!-- Character Body & Visor -->
        <div class="body">
          <div class="visor"></div>
          <div class="core-light"></div>
        </div>
        
        <!-- Wings & Cargo Box -->
        <div class="wing wing-left"></div>
        <div class="wing wing-right"></div>
        <div class="cargo-box"></div>
        <div class="thruster"></div>
      </div>
    </div>

    <!-- Mobile On-Screen Controls (D-Pad & Space Button) -->
    <div id="mobileControls" class="mobile-controls">
      <div class="dpad">
        <button id="btnUp" class="dpad-btn dpad-up" aria-label="Up">▲</button>
        <button id="btnLeft" class="dpad-btn dpad-left" aria-label="Left">◀</button>
        <button id="btnRight" class="dpad-btn dpad-right" aria-label="Right">▶</button>
        <button id="btnDown" class="dpad-btn dpad-down" aria-label="Down">▼</button>
        <div class="dpad-center"></div>
      </div>
      <button id="btnSpace" class="space-btn" aria-label="Drop Package">SPACE</button>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
