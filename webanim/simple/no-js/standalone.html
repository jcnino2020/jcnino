<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Web Animation - Flying Drone (Single HTML File / Pure CSS)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0b1329;
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
    }

    .info-toggle-checkbox {
      display: none;
    }

    .stage {
      position: relative;
      width: 100vw;
      height: 100vh;
      background: linear-gradient(180deg, #0b1329 0%, #17153b 50%, #1e1b4b 100%);
      overflow: hidden;
    }

    .sky-backdrop {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    .moon {
      position: absolute;
      top: 8%;
      right: 10%;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, #fef08a 0%, #fde047 70%);
      border-radius: 50%;
      box-shadow: 0 0 50px rgba(253, 224, 71, 0.35);
    }

    .cloud {
      position: absolute;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 50px;
      pointer-events: none;
    }

    .cloud-1 {
      top: 12%;
      left: 5%;
      width: 220px;
      height: 60px;
      animation: floatCloud 30s linear infinite;
    }

    .cloud-2 {
      top: 30%;
      left: 60%;
      width: 280px;
      height: 70px;
      animation: floatCloud 40s linear infinite reverse;
    }

    .cloud-3 {
      top: 55%;
      left: 20%;
      width: 240px;
      height: 65px;
      animation: floatCloud 35s linear infinite;
    }

    .cloud-4 {
      top: 75%;
      left: 70%;
      width: 300px;
      height: 80px;
      animation: floatCloud 45s linear infinite reverse;
    }

    @keyframes floatCloud {
      0% { transform: translateX(-80px); }
      50% { transform: translateX(80px); }
      100% { transform: translateX(-80px); }
    }

    .badge {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(56, 189, 248, 0.3);
      border-radius: 20px;
      font-size: 0.85rem;
      font-weight: 600;
      color: #38bdf8;
      z-index: 15;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
    }

    .badge .dot {
      width: 8px;
      height: 8px;
      background-color: #22c55e;
      border-radius: 50%;
      box-shadow: 0 0 8px #22c55e;
      animation: pulseDot 1.5s ease-in-out infinite alternate;
    }

    @keyframes pulseDot {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }

    .controls-hint {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(0);
      padding: 12px 24px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 30px;
      font-size: 0.92rem;
      color: #cbd5e1;
      z-index: 10;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }

    .info-toggle-checkbox:not(:checked) ~ .stage .controls-hint {
      opacity: 0;
      pointer-events: none;
      transform: translateX(-50%) translateY(16px);
    }

    .info-btn {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 12;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
      transition: all 0.2s ease;
    }

    .info-svg {
      width: 22px;
      height: 22px;
      stroke: #ffffff;
      transition: transform 0.2s ease;
    }

    .info-btn:hover {
      background: rgba(30, 41, 59, 0.9);
      border-color: #38bdf8;
      transform: scale(1.1);
      box-shadow: 0 6px 20px rgba(56, 189, 248, 0.3);
    }

    .drone-flight-path {
      position: absolute;
      top: 40%;
      left: 50%;
      width: 150px;
      height: 150px;
      margin-left: -75px;
      margin-top: -75px;
      z-index: 5;
      animation: droneFlyLoop 16s ease-in-out infinite;
    }

    @keyframes droneFlyLoop {
      0% { transform: translate(-30vw, -40px) rotate(-12deg); }
      20% { transform: translate(25vw, -10px) rotate(14deg); }
      25% { transform: translate(30vw, 20px) rotate(4deg); }
      45% { transform: translate(-10vw, 60px) rotate(-16deg); }
      50% { transform: translate(-25vw, 40px) rotate(-5deg); }
      70% { transform: translate(15vw, -60px) rotate(12deg); }
      85% { transform: translate(0vw, 0px) rotate(-4deg); }
      100% { transform: translate(-30vw, -40px) rotate(-12deg); }
    }

    .character {
      width: 100%;
      height: 100%;
    }

    .drone-rig {
      position: relative;
      width: 100%;
      height: 100%;
      filter: drop-shadow(0 15px 22px rgba(0, 0, 0, 0.5));
      animation: droneBob 2.5s ease-in-out infinite alternate;
    }

    @keyframes droneBob {
      0% { transform: translateY(-8px); }
      100% { transform: translateY(8px); }
    }

    .drone-body {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }

    .propeller {
      position: absolute;
      width: 46%;
      height: 46%;
      pointer-events: none;
      z-index: 3;
      transform-origin: 50% 50%;
    }

    .propeller img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }

    .prop-top-left {
      top: 29.8%;
      left: 7.0%;
      animation: spinCW 0.08s linear infinite;
    }

    .prop-top-right {
      top: 29.8%;
      left: 93.0%;
      animation: spinCCW 0.08s linear infinite;
    }

    .prop-bottom-left {
      top: 66.4%;
      left: 3.5%;
      animation: spinCCW 0.08s linear infinite;
    }

    .prop-bottom-right {
      top: 66.4%;
      left: 96.5%;
      animation: spinCW 0.08s linear infinite;
    }

    @keyframes spinCW {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(360deg); }
    }

    @keyframes spinCCW {
      0% { transform: translate(-50%, -50%) rotate(0deg); }
      100% { transform: translate(-50%, -50%) rotate(-360deg); }
    }

    .nav-light {
      position: absolute;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      z-index: 4;
      pointer-events: none;
      transform: translate(-50%, -50%);
    }

    .light-front-left {
      top: 66.4%;
      left: 3.5%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444;
      animation: blinkNav 1s infinite alternate;
    }

    .light-front-right {
      top: 66.4%;
      left: 96.5%;
      background: #ef4444;
      box-shadow: 0 0 10px #ef4444, 0 0 20px #ef4444;
      animation: blinkNav 1s infinite alternate 0.5s;
    }

    @keyframes blinkNav {
      0% { opacity: 0.3; transform: translate(-50%, -50%) scale(0.8); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1.3); }
    }

    .cargo-box {
      position: absolute;
      top: 72%;
      left: 50%;
      transform: translateX(-50%);
      width: 34px;
      height: 34px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(0, 0, 0, 0.5));
      z-index: 1;
    }

    .package-drop-wrapper {
      position: absolute;
      top: 80px;
      left: 50%;
      width: 32px;
      height: 32px;
      margin-left: -16px;
      pointer-events: none;
      opacity: 0;
    }

    .package-drop-wrapper .package {
      width: 100%;
      height: 100%;
      background: url('../assets/box.png') center/contain no-repeat;
      filter: drop-shadow(0 6px 12px rgba(0, 0, 0, 0.5));
    }

    .package-drop-wrapper .landing-puff {
      position: absolute;
      bottom: -20px;
      left: 50%;
      width: 40px;
      height: 14px;
      background: rgba(255, 255, 255, 0.6);
      border-radius: 50%;
      transform: translate(-50%, 0) scale(0);
      opacity: 0;
    }

    .drop-1 {
      animation: dropSequence 8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      animation-delay: 1.5s;
    }

    .drop-1 .landing-puff {
      animation: puffSequence 8s ease-out infinite;
      animation-delay: 1.5s;
    }

    .drop-2 {
      animation: dropSequence 8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      animation-delay: 4.2s;
    }

    .drop-2 .landing-puff {
      animation: puffSequence 8s ease-out infinite;
      animation-delay: 4.2s;
    }

    .drop-3 {
      animation: dropSequence 8s cubic-bezier(0.45, 0, 0.55, 1) infinite;
      animation-delay: 6.8s;
    }

    .drop-3 .landing-puff {
      animation: puffSequence 8s ease-out infinite;
      animation-delay: 6.8s;
    }

    @keyframes dropSequence {
      0% {
        opacity: 0;
        transform: translateY(0) rotate(0deg);
      }
      3% {
        opacity: 1;
        transform: translateY(10px) rotate(5deg);
      }
      25% {
        opacity: 1;
        transform: translateY(calc(55vh)) rotate(180deg);
      }
      30% {
        opacity: 0.8;
        transform: translateY(calc(55vh)) rotate(180deg);
      }
      40%, 100% {
        opacity: 0;
        transform: translateY(calc(55vh)) rotate(180deg);
      }
    }

    @keyframes puffSequence {
      0%, 23% {
        opacity: 0;
        transform: translate(-50%, 0) scale(0.2);
      }
      25% {
        opacity: 0.8;
        transform: translate(-50%, 0) scale(0.6);
      }
      32% {
        opacity: 0;
        transform: translate(-50%, 0) scale(1.8);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, 0) scale(1.8);
      }
    }

    @media (max-width: 768px) {
      .controls-hint {
        bottom: auto;
        top: 16px;
        font-size: 0.78rem;
        padding: 8px 16px;
        max-width: 70%;
        text-align: center;
      }

      .info-btn {
        bottom: 20px;
        right: 20px;
      }
    }
  </style>
</head>

<body>
  <input type="checkbox" id="info-toggle" class="info-toggle-checkbox" checked>

  <main class="stage">
    <div class="sky-backdrop">
      <div class="moon"></div>
      <div class="cloud cloud-1"></div>
      <div class="cloud cloud-2"></div>
      <div class="cloud cloud-3"></div>
      <div class="cloud cloud-4"></div>
    </div>

    <div class="badge">
      <span class="dot"></span> Pure CSS (No JS) Single File
    </div>

    <div class="controls-hint">
      <span>✨ Single HTML File running 100% on Pure CSS — No JS required! 📦</span>
    </div>

    <label for="info-toggle" class="info-btn" title="Toggle Info Banner" aria-label="Toggle Info">
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
        stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="info-svg">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="12" y1="16" x2="12" y2="12"></line>
        <line x1="12" y1="8" x2="12.01" y2="8"></line>
      </svg>
    </label>

    <div class="drone-flight-path">
      <div class="character">
        <div class="drone-rig">
          <div class="propeller prop-top-left"><img src="../assets/propeller.png" alt="Propeller"></div>
          <div class="propeller prop-top-right"><img src="../assets/propeller.png" alt="Propeller"></div>
          <div class="propeller prop-bottom-left"><img src="../assets/propeller.png" alt="Propeller"></div>
          <div class="propeller prop-bottom-right"><img src="../assets/propeller.png" alt="Propeller"></div>

          <img src="../assets/drone-back.png" alt="Drone Back" class="drone-body">

          <div class="nav-light light-front-left"></div>
          <div class="nav-light light-front-right"></div>

          <img src="../assets/box.png" alt="Cargo Box" class="cargo-box">
        </div>
      </div>

      <div class="package-drop-wrapper drop-1">
        <div class="package"></div>
        <div class="landing-puff"></div>
      </div>
      <div class="package-drop-wrapper drop-2">
        <div class="package"></div>
        <div class="landing-puff"></div>
      </div>
      <div class="package-drop-wrapper drop-3">
        <div class="package"></div>
        <div class="landing-puff"></div>
      </div>
    </div>
  </main>
</body>

</html>
