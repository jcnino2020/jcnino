<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Framed Moments | JC Niñonuevo</title>
  <link rel="icon" type="image/png" href="images/favicon.png">
  
  <!-- SEO & Metadata -->
  <meta name="description" content="A collection of quick glimpses — peaceful nature scenes and busy city lights. Street and editorial photography by JC Niñonuevo.">
  <link rel="canonical" href="https://jcnino.vercel.app/framed-moments">
  
  <!-- Open Graph / Facebook -->
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://jcnino.vercel.app/framed-moments">
  <meta property="og:title" content="Framed Moments | JC Niñonuevo">
  <meta property="og:description" content="A collection of quick glimpses — peaceful nature scenes and busy city lights.">
  <meta property="og:image" content="https://jcnino.vercel.app/images/Framed%20Moments/FM-01.JPG">

  <!-- Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Framed Moments | JC Niñonuevo">
  <meta name="twitter:description" content="A collection of quick glimpses — peaceful nature scenes and busy city lights.">
  <meta name="twitter:image" content="https://jcnino.vercel.app/images/Framed%20Moments/FM-01.JPG">

  <link rel="stylesheet" href="assets/tailwind.css">
  <link rel="stylesheet" href="assets/portfolio.css">

</head>
<body class="min-h-screen">

<div id="navbar-placeholder"></div>

<!-- Assets -->
<script src="assets/portfolio.js" defer></script>

<div class="pt-16 md:pt-20">

  <!-- Page Header -->
  <section id="page-header" class="pt-6 pb-6 md:py-12 border-b border-border">
    <div class="max-w-7xl mx-auto px-6 sm:px-10">
      <div class="flex flex-col md:flex-row items-start md:items-end justify-between gap-6">
        <div>
          <p id="header-eyebrow" class="gsap-header-item text-text-muted text-xs font-bold uppercase mb-4">Category 02</p>
          <h1 id="header-title" class="gsap-header-item text-4xl sm:text-5xl text-white font-bold">Framed Moments</h1>
          <p id="header-desc" class="gsap-header-item text-text-muted text-lg max-w-lg mt-4">A collection of quick glimpses — peaceful nature scenes and busy city lights, caught between motion and quiet moments.</p>
        </div>
        <div class="flex justify-end">
          <p id="photo-count" class="gsap-header-item text-text-muted text-xs font-bold"></p>
        </div>
      </div>
    </div>
  </section>

  <!-- Gallery Grid -->
  <section class="pt-2 pb-6 md:py-12">
    <div class="max-w-7xl mx-auto px-6 sm:px-10">
      <div class="gallery-grid" id="main-grid"></div>
    </div>
  </section>
  <script src="assets/gallery-data.js"></script>
  <script>
  const allPhotos = window.galleryData.framed.map((p, i) => {
    const base = p.file.replace(/\.[^/.]+$/, "");
    return {
      id: i,
      src: 'images/Framed%20Moments/' + p.file,
      subfolder: 'Framed%20Moments',
      base: base,
      alt: p.alt || ('Street and editorial photograph by JC Niñonuevo — ' + base),
      desc: p.desc || ''
    };
  });

  function buildCard(p, gallery) {
    const wrap = document.createElement('div');
    wrap.className = 'gallery-item relative rounded-xl overflow-hidden cursor-pointer group';
    const b = p.base;
    const sf = p.subfolder;
    const rawDesc = p.desc || p.alt || '';
    let descHTML = '';
    if (rawDesc.includes('•')) {
      const parts = rawDesc.split('•').map(s => s.trim());
      const title = parts[0];
      const locParts = parts.slice(1).flatMap(p => p.split(',').map(s => s.trim()));
      const locHTML = locParts.map(lp => `<span class="text-white/95 text-xs font-medium [text-shadow:_0_1.5px_4px_rgba(0,0,0,1),_0_1px_2px_rgba(0,0,0,1)]">${lp}</span>`).join('');
      descHTML = `<div class="flex flex-col gap-0.5"><span class="text-white text-sm font-bold leading-snug [text-shadow:_0_2px_6px_rgba(0,0,0,1),_0_1px_3px_rgba(0,0,0,1)]">${title}</span>${locHTML}</div>`;
    } else {
      descHTML = `<p class="photo-desc text-white text-sm leading-snug font-medium [text-shadow:_0_2px_6px_rgba(0,0,0,1),_0_1px_3px_rgba(0,0,0,1)]">${rawDesc}</p>`;
    }
    wrap.innerHTML = `
      <picture>
        <source
          type="image/webp"
          srcset="
            images/optimized/800/${sf}/${b}-800.webp 800w,
            images/optimized/1200/${sf}/${b}-1200.webp 1200w,
            images/optimized/1600/${sf}/${b}-1600.webp 1600w
          "
          sizes="(max-width: 600px) 100vw, (max-width: 1024px) 50vw, 33vw"
        />
        <img
          src="images/optimized/1200/${sf}/${b}-1200.webp"
          alt="${p.alt}"
          loading="lazy"
          decoding="async"
          class="w-full h-auto block"
          onerror="this.parentElement.parentElement.querySelector('img').src='${p.src}'" />
      </picture>
      <!-- Info "i" Badge (Mobile only) -->
      <button type="button" aria-label="View photo details" class="info-btn md:hidden absolute top-3 right-3 z-20 w-8 h-8 rounded-full bg-black/60 backdrop-blur-md text-white flex items-center justify-center border border-white/30 shadow-lg cursor-pointer transition-all duration-300 ease-out active:scale-90 group-[.active-desc]:bg-white group-[.active-desc]:text-black group-[.active-desc]:border-white group-[.active-desc]:rotate-180 group-[.active-desc]:scale-105">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
        </svg>
      </button>
      <!-- Hover / Active Text Overlay (Strong text drop shadow, no gradient background) -->
      <div class="card-overlay absolute inset-0 opacity-0 translate-y-2 md:group-hover:opacity-100 md:group-hover:translate-y-0 group-[.active-desc]:opacity-100 group-[.active-desc]:translate-y-0 transition-all duration-300 ease-out flex items-end p-4 sm:p-5 pointer-events-none">
        <div class="w-full flex items-end justify-between gap-3">
          ${descHTML}
          <svg class="w-5 h-5 text-white opacity-90 shrink-0 mb-0.5 [filter:drop-shadow(0_2px_4px_rgba(0,0,0,1))]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
          </svg>
        </div>
      </div>
    `;
    const infoBtn = wrap.querySelector('.info-btn');
    if (infoBtn) {
      infoBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        const wasActive = wrap.classList.contains('active-desc');
        document.querySelectorAll('.gallery-item.active-desc').forEach(el => el.classList.remove('active-desc'));
        if (!wasActive) {
          wrap.classList.add('active-desc');
        }
      });
    }
    wrap.addEventListener('click', () => {
      const isMobile = window.innerWidth < 768;
      if (isMobile) {
        if (!wrap.classList.contains('active-desc')) {
          document.querySelectorAll('.gallery-item.active-desc').forEach(el => el.classList.remove('active-desc'));
          wrap.classList.add('active-desc');
          return;
        }
      }
      document.querySelectorAll('.gallery-item.active-desc').forEach(el => el.classList.remove('active-desc'));
      openLightbox(p, gallery);
    });
    return wrap;
  }

  function renderGrid() {
    const grid = document.getElementById('main-grid');
    if(!grid) return;
    grid.innerHTML = '';
    document.getElementById('photo-count').textContent = allPhotos.length + ' photos';
    allPhotos.forEach(p => grid.appendChild(buildCard(p, allPhotos)));

    // GSAP: batch animate gallery items as they enter viewport
    requestAnimationFrame(() => {
      ScrollTrigger.batch('#main-grid .gallery-item', {
        onEnter: batch => gsap.fromTo(batch,
          { y: 50, opacity: 0 },
          {
            y: 0, opacity: 1,
            duration: 0.6,
            stagger: 0.07,
            ease: 'power3.out',
            clearProps: 'transform,opacity'
          }
        ),
        once: true,
        start: 'top 95%'
      });
    });
  }

  document.addEventListener('DOMContentLoaded', renderGrid);
</script>

</div>

<div id="footer-placeholder"></div>


<!-- Lightbox -->
<div id="lightbox-placeholder"></div>



<!-- GSAP + ScrollTrigger -->
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.13/dist/ScrollTrigger.min.js"></script>

<script>
  document.addEventListener('DOMContentLoaded', () => {
    gsap.registerPlugin(ScrollTrigger);

    // ── 2. PAGE HEADER: staggered timeline on load (above fold — no ScrollTrigger)
    const headerTl = gsap.timeline({ delay: 0.3 });
    headerTl
      .fromTo('#header-eyebrow',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' }
      )
      .fromTo('#header-title',
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.7, ease: 'power3.out' },
        '-=0.35'
      )
      .fromTo('#header-desc',
        { opacity: 0, y: 20 },
        { opacity: 1, y: 0, duration: 0.6, ease: 'power3.out' },
        '-=0.4'
      )
      .fromTo('#photo-count',
        { opacity: 0, y: 10 },
        { opacity: 1, y: 0, duration: 0.5, ease: 'power2.out' },
        '-=0.3'
      );

    // ── 3. FOOTER: fade up on scroll
    gsap.fromTo('#site-footer',
      { y: 30, opacity: 0 },
      {
        y: 0, opacity: 1,
        duration: 0.6, ease: 'power2.out',
        scrollTrigger: {
          trigger: '#site-footer',
          start: 'top 95%',
          once: true
        }
      }
    );
  });
</script>

<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script>
  // Vercel Analytics: only load on Vercel-hosted pages (keeps local viewing console-clean)
  if (location.protocol === 'https:' && location.hostname.endsWith('vercel.app')) {
    document.write('<script defer src="/_vercel/insights/script.js"><\/script>');
  }
</script>

</body>
</html>
